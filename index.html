<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>冥想心情打卡</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#5bb1a8">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="header">
    <h1 class="app-title">🌳 冥想小屋</h1>
    <p class="app-sub">沉浸在自然与平静中，调适你的每一天。</p>
  </header>

  <main>
    <!-- 欢迎页 -->
    <section class="center" id="welcome">
      <div class="card">
        <h2>欢迎进入冥想小屋</h2>
        <p>沉浸在自然与平静中，调适你的每一天。</p>
        <button class="btn" id="startBtn" type="button">开始打卡</button>
      </div>
    </section>

    <!-- 日志记录页 -->
    <section class="center hide" id="journal" aria-hidden="true">
      <div class="card">
        <div id="character-container" style="position:relative; min-height:84px;"></div>

        <h2>📝 记录今日心情</h2>

        <form id="entryForm" onsubmit="return false;">
          <label for="mood" class="label">请选择今日心情</label>
          <select id="mood" name="mood" aria-label="今日心情">
            <option value="calm">🌞 平静</option>
            <option value="happy">🌈 开心</option>
            <option value="sad">🌧️ 忧郁</option>
            <option value="anxious">🌊 焦虑</option>
            <option value="unconfident">🌪️ 怀疑自我</option>
          </select>

          <label for="entry" class="sr-only">今日记录</label>
          <textarea id="entry" name="entry" placeholder="在这里写下你的心情/冥想想法……" aria-required="true"></textarea>

          <div class="row" style="align-items:center;">
            <button class="btn" id="submitBtn" type="button">获取冥想引导</button>
            <div class="error" id="errorMsg" role="alert" aria-live="polite"></div>
          </div>
        </form>
      </div>
    </section>

    <!-- 冥想引导页 -->
    <section class="center hide" id="guide" aria-hidden="true">
      <div class="card">
        <div id="guideTitle" aria-live="polite"></div>
        <div class="guide" id="guideContent" aria-live="polite"></div>
        <div style="margin-top:16px;">
          <button class="btn" id="againBtn" type="button">再记录一次</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <small>© 你的冥想小屋</small>
  </footer>

  <!-- 脚本：先角色，再主逻辑 -->
  <script src="character.js"></script>
  <script src="main.js"></script>
</body>
</html>
